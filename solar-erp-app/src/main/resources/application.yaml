spring:
  application:
    name: solar-erp-app
  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
      allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
    bootstrap-admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      role: ${BOOTSTRAP_ADMIN_ROLE:ADMIN}
    login-abuse:
      rate-limit:
        window-minutes: ${LOGIN_RATE_LIMIT_WINDOW_MINUTES:1}
        max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:20}
      lockout:
        max-failed-attempts: ${LOGIN_LOCKOUT_MAX_FAILED_ATTEMPTS:5}
        duration-minutes: ${LOGIN_LOCKOUT_DURATION_MINUTES:15}

server:
  port: ${SERVER_PORT:8080}

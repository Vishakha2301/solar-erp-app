spring:
  application:
    name: solar-erp-app
  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
      allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}

server:
  port: ${SERVER_PORT:8080}

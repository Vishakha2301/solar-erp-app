spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: ${DB_MIN_IDLE:5}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:25}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      max-lifetime: ${DB_MAX_LIFETIME:1500000}
      keepalive-time: ${DB_KEEPALIVE_TIME:300000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET}

app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
      allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
    bootstrap-admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      role: ${BOOTSTRAP_ADMIN_ROLE:ADMIN}
    login-abuse:
      rate-limit:
        window-minutes: ${LOGIN_RATE_LIMIT_WINDOW_MINUTES:1}
        max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:20}
      lockout:
        max-failed-attempts: ${LOGIN_LOCKOUT_MAX_FAILED_ATTEMPTS:5}
        duration-minutes: ${LOGIN_LOCKOUT_DURATION_MINUTES:15}

server:
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
